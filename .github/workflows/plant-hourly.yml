name: Plant Chemistry Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'  # Every hour

jobs:
  plant-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show checked-out revision
        run: |
          echo "Commit: $(git rev-parse HEAD)"
          echo "Branch/ref: $GITHUB_REF"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Tamil font support
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fontconfig
          FONT_PATH="$(fc-match -f '%{file}' 'Noto Sans Tamil' | head -n 1)"
          if [ -z "$FONT_PATH" ] || [ ! -f "$FONT_PATH" ]; then
            echo "Noto Sans Tamil font was not found after installation" >&2
            fc-list | grep -i tamil || true
            exit 1
          fi
          echo "TAMIL_FONT_PATH=$FONT_PATH" >> "$GITHUB_ENV"
          echo "Using Tamil font: $FONT_PATH"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run plant chemistry bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python main.py
