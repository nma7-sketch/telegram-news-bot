name: 30-Minute Market News

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read

concurrency:
  group: market-news
  cancel-in-progress: false

jobs:
  send-market-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Restore duplicate-news history
        uses: actions/cache/restore@v4
        with:
          path: .market_news_state.json
          key: market-news-${{ github.run_id }}
          restore-keys: |
            market-news-

      - name: Install Telegram dependency
        run: python -m pip install 'python-telegram-bot>=20.0'

      - name: Send recent public market news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: python market_news.py

      - name: Save duplicate-news history
        if: always() && hashFiles('.market_news_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .market_news_state.json
          key: market-news-${{ github.run_id }}
